<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Geist;
        font-style: normal;
        font-weight: 100 900;
        src: url("Geist-Variable.woff2") format("woff2");
      }
      :root {
        --paper: #f7f7f5;
        --ink: #171717;
        --cobalt: #2626ff;
        --card-surface: #ffffff;
        --card-shadow:
          0 0 0 1px rgba(23, 23, 23, 0.04),
          0 1px 2px rgba(23, 23, 23, 0.08),
          0 10px 20px -6px rgba(23, 23, 23, 0.14),
          0 28px 48px -16px rgba(23, 23, 23, 0.18);
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: Geist, Arial, sans-serif;
      }
      .lockup {
        position: absolute;
        top: 64px;
        left: 72px;
        z-index: 10;
      }
      .lockup svg {
        display: block;
        color: var(--cobalt);
      }
      .lede {
        margin: 18px 0 0 1px;
        font-size: 27px;
        font-weight: 500;
        letter-spacing: -0.015em;
        line-height: 1.2;
        white-space: nowrap;
      }
      .card {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 250px;
        height: 250px;
        border-radius: 22px;
        background: var(--card-surface);
        box-shadow: var(--card-shadow);
      }
      .c-google {
        top: -64px;
        right: -56px;
        transform: rotate(11deg);
      }
      .c-azure {
        top: 306px;
        right: -34px;
        transform: rotate(-9deg);
      }
      .c-supabase {
        left: 256px;
        bottom: -52px;
        background: var(--ink);
        transform: rotate(-7deg);
      }
      .c-rds {
        left: 486px;
        bottom: -30px;
        z-index: 2;
        transform: rotate(4deg);
      }
    </style>
  </head>
