name: Deploy

# Deploys the website to Vercel on every push to main, independent of who
# merged. Requires the repo secrets VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID. The Vercel Git integration's own production deploys
# should be disabled so builds don't run twice.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The project's Root Directory, framework and build settings are read
      # from Vercel, so the CLI runs from the repo root.
      - name: Deploy to production
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
